name: Build desktop applications
on:
  push:
    paths:
      - 'Python/**'
      - 'Matlab/EQD2_with_tolerances_090126.xlsx'
      - 'packaging/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release to receive tested executables
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r packaging/requirements.txt
      - name: Test calculations and exports
        run: python -m unittest discover -s Python/tests -v
      - name: Build and smoke-test packaged application
        run: python packaging/build.py
      - name: Upload executables to draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" dist/EMBRACE-EQD2-*.zip --clobber
      - name: Upload standalone application
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: EMBRACE-EQD2-${{ matrix.label }}
          path: dist/EMBRACE-EQD2-*.zip
          if-no-files-found: error
          retention-days: 30
